<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayIngles - Lugares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/main.css">
</head>

<body class="bg-slate-50 min-h-screen flex flex-col text-slate-900 font-sans">

    <header class="bg-white py-6 border-b border-slate-200 shadow-sm">
        <h1 class="text-3xl font-extrabold text-center bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-600 tracking-tight uppercase">
            PlayIngles
        </h1>
    </header>

    <nav class="bg-indigo-600 shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex justify-center space-x-6 py-3 flex-wrap">
                <a href="/index.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-transparent hover:border-white pb-1">Principal</a>
                <a href="verbos.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-transparent hover:border-white pb-1">Verbos</a>
                <a href="familia.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-transparent hover:border-white pb-1">Familia</a>
                <a href="lugares.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-white pb-1">Lugares</a>
                <a href="comida.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-transparent hover:border-white pb-1">Comida</a>
                <a href="ocupaciones.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-transparent hover:border-white pb-1">Ocupaciones</a>
                <a href="ropa.html" class="text-indigo-100 hover:text-white text-sm font-semibold transition-all border-b-2 border-transparent hover:border-white pb-1">Ropa</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto w-full p-6 space-y-12">
        <section class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
            <div class="bg-gray-50/50 px-8 py-5 border-b border-gray-100 flex justify-between items-center">
                <h2 class="text-xl font-black text-gray-700 uppercase tracking-widest">Lugares</h2>
            </div>

            <div id="table-container" class="overflow-x-auto">
                <div class="max-h-[600px] overflow-y-auto custom-scrollbar">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-white sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-6 py-4 text-lg font-bold text-indigo-600 uppercase text-start">Inglés</th>
                                <th class="px-6 py-4 text-lg font-bold text-indigo-600 uppercase text-center">Pronunciación</th>
                                <th class="px-6 py-4 text-lg font-bold text-indigo-600 uppercase text-center">Español</th>
                            </tr>
                        </thead>
                        <tbody id="statsTableBody" class="divide-y divide-gray-50"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <footer class="mt-auto py-8 text-center text-gray-400 text-sm">
        &copy; 2026 PlayIngles • Aprende Inglés con estilo
    </footer>

    <script type="module">
        import { placesExamples } from '/src/data/examples.js';
        import { speak } from '/src/utils/speech.js';

        document.addEventListener('DOMContentLoaded', () => {
            const tbody = document.getElementById('statsTableBody');
            const fragment = document.createDocumentFragment();

            placesExamples.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-indigo-50/30 transition-colors border-b border-gray-50';
                row.innerHTML = `
                    <td class="px-6 py-4 text-base font-medium text-indigo-600">
                        <div class="flex items-center gap-2">
                            <button class="speak-btn p-1.5 bg-indigo-100 hover:bg-indigo-200 rounded-full transition-colors" title="Escuchar">
                                <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                                </svg>
                            </button>
                            ${item.english}
                        </div>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <span class="text-base text-gray-500 font-medium">${item.pron || '---'}</span>
                    </td>
                    <td class="px-6 py-4 text-center bg-blue-50/30">
                        <span class="text-base font-bold text-blue-600">${item.spanish || '---'}</span>
                    </td>
                `;
                row.querySelector('.speak-btn').addEventListener('click', () => speak(item.english));
                fragment.appendChild(row);
            });

            tbody.appendChild(fragment);
        });
    </script>
</body>

</html>
